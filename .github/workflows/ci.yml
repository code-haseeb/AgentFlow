name: AgentFlow CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow_dev_password
          POSTGRES_DB: agentflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agentflow:agentflow_dev_password@localhost:5432/agentflow?schema=public
      JWT_SECRET: super-secret-agentflow-jwt-key-change-in-production-min-32-chars
      REFRESH_TOKEN_SECRET: super-secret-agentflow-refresh-token-key-change-min-32
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      AI_PROVIDER: mock
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Build Shared Types
        run: pnpm --filter @agentflow/types build

      - name: Initialize Database Schema
        run: |
          cd apps/api
          pnpm exec prisma generate
          pnpm exec prisma db push

      - name: Run Backend Tests
        run: pnpm --filter @agentflow/api test

      - name: Set up AI Service Virtualenv
        run: |
          cd apps/ai-service
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pytest tests

      - name: Build Web Application
        run: pnpm --filter @agentflow/web build
